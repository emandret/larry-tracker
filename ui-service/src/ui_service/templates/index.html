<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Where's Larry?</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        #app { display: flex; height: 100%; }

        #map { flex: 1 1 auto; height: 100%; }

        #sidebar {
            width: 300px;
            flex: 0 0 auto;
            height: 100%;
            overflow-y: auto;
            border-right: 1px solid #ddd;
            background: #fafafa;
        }
        #sidebar h1 {
            font-size: 16px;
            margin: 0;
            padding: 14px 16px;
            border-bottom: 1px solid #ddd;
            background: white;
        }
        #trip-list { list-style: none; margin: 0; padding: 0; }
        .trip-item {
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .trip-item:hover { background: #f0f4ff; }
        .trip-item.selected { background: #e0ebff; }
        .trip-item .range { font-size: 13px; font-weight: 600; }
        .trip-item .meta { font-size: 12px; color: #666; margin-top: 2px; }
        .badge {
            display: inline-block;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 10px;
            margin-top: 4px;
            color: white;
        }
        .badge.round-trip { background: #16a34a; }
        .badge.one-way { background: #d97706; }
        .badge.unknown { background: #6b7280; }

        #empty-state {
            padding: 16px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="sidebar">
            <h1>Where's Larry?</h1>
            <div id="empty-state" hidden>No trips recorded yet.</div>
            <ul id="trip-list"></ul>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const TRIP_COLORS = ["#2563eb", "#dc2626", "#16a34a", "#9333ea", "#ea580c", "#0891b2"];

        const map = L.map("map").setView([51.513487, -0.020869], 13); // overridden by fitBounds once trips load
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);

        const mapLayers = L.layerGroup().addTo(map); // cleared and rebuilt on every refresh
        let tripLayers = []; // { trip, polyline, markers, listEl }

        function formatTime(iso) {
            return new Date(iso).toLocaleString([], {
                month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
            });
        }

        function formatTimePrecise(iso) {
            return new Date(iso).toLocaleString([], {
                month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit",
            });
        }

        function pointPopupHtml(p) {
            return `
                <div style="font-size: 13px; line-height: 1.5;">
                    <strong>${formatTimePrecise(p.timestamp)}</strong><br>
                    ${p.latitude.toFixed(6)}, ${p.longitude.toFixed(6)}<br>
                    Accuracy: &plusmn;${p.horizontal_accuracy}m<br>
                    Confidence: ${p.confidence}
                </div>
            `;
        }

        function badgeFor(trip) {
            if (trip.is_round_trip === true) return ["round-trip", "Round trip"];
            if (trip.is_round_trip === false) return ["one-way", "Did not return home"];
            return ["unknown", "Trip"];
        }

        function selectTrip(index) {
            tripLayers.forEach(({ polyline, markers, listEl }, i) => {
                const selected = i === index;
                polyline.setStyle({ weight: selected ? 5 : 3, opacity: selected ? 1 : 0.35 });
                markers.forEach((m) => m.setStyle({ opacity: selected ? 1 : 0.3, fillOpacity: selected ? 0.9 : 0.25 }));
                listEl.classList.toggle("selected", selected);
            });

            const { polyline } = tripLayers[index];
            map.fitBounds(polyline.getBounds(), { padding: [20, 20] });
        }

        function renderTrips(data) {
            const listEl = document.getElementById("trip-list");
            const emptyEl = document.getElementById("empty-state");
            listEl.innerHTML = "";
            tripLayers = [];
            mapLayers.clearLayers();

            if (data.home) {
                L.circleMarker([data.home.latitude, data.home.longitude], {
                    radius: 8, color: "#111827", fillColor: "#fbbf24", fillOpacity: 1,
                })
                    .addTo(mapLayers)
                    .bindPopup("Home");
            }

            if (!data.trips.length) {
                emptyEl.hidden = false;
                return;
            }
            emptyEl.hidden = true;

            const allBounds = [];

            data.trips.forEach((trip, i) => {
                const color = TRIP_COLORS[i % TRIP_COLORS.length];
                const latLngs = trip.points.map((p) => [p.latitude, p.longitude]);
                const polyline = L.polyline(latLngs, { color, weight: 3, opacity: 0.35 }).addTo(mapLayers);
                allBounds.push(...latLngs);

                const markers = trip.points.map((p) =>
                    L.circleMarker([p.latitude, p.longitude], {
                        radius: 5,
                        color: "#111827",
                        weight: 1,
                        fillColor: color,
                        fillOpacity: 0.25,
                        opacity: 0.3,
                    })
                        .addTo(mapLayers)
                        .bindPopup(pointPopupHtml(p))
                );

                const [badgeClass, badgeText] = badgeFor(trip);
                const item = document.createElement("li");
                item.className = "trip-item";
                item.innerHTML = `
                    <div class="range">${formatTime(trip.start)} - ${formatTime(trip.end)}</div>
                    <div class="meta">${trip.point_count} point(s) &middot; ${trip.duration_minutes} min</div>
                    <span class="badge ${badgeClass}">${badgeText}</span>
                `;
                item.style.borderLeft = `4px solid ${color}`;
                item.addEventListener("click", () => selectTrip(i));
                listEl.appendChild(item);

                tripLayers.push({ trip, polyline, markers, listEl: item });
            });

            if (allBounds.length) {
                map.fitBounds(allBounds, { padding: [20, 20] });
            }
        }

        async function loadTrips() {
            try {
                const response = await fetch("/api/trips");
                const data = await response.json();
                renderTrips(data);
            } catch (err) {
                console.error("Failed to load trips", err);
            }
        }

        loadTrips();
        setInterval(loadTrips, 60_000);
    </script>
</body>
</html>
